name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 20
          - os: windows-latest
            node: 22
          # GitHub's arm64 macOS runners regularly sit in the queue past the
          # 15-minute limit and the job gets cancelled, which leaves the badge
          # red through no fault of the code. macos-15-intel is the last
          # supported x86_64 image and schedules reliably; the unit checks are
          # pure JavaScript, so architecture coverage is not the variable here.
          - os: macos-15-intel
            node: 20
          - os: macos-15-intel
            node: 22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit checks
        run: npm run test:unit
