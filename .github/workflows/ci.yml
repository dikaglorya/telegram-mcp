name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  TELEGRAM_API_ID: '1'
  TELEGRAM_API_HASH: 'test-hash'
  TELEGRAM_STATE_DIR: '/tmp/telegram-mcp-ci'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Check formatting (prettier)
        run: npx prettier --check "**/*.{ts,json,md}" --ignore-path .gitignore 2>/dev/null || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run unit tests
        run: node harness/unit.mjs
      - name: Run access/approval tests
        run: node harness/access.mjs

  mcp-read-only:
    name: MCP Read-Only Harness (requires real creds)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run MCP read-only harness
        run: node harness/mcp-harness.mjs
        env:
          TELEGRAM_API_ID: ${{ env.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ env.TELEGRAM_API_HASH }}
          TELEGRAM_STATE_DIR: ${{ env.TELEGRAM_STATE_DIR }}

  package-smoke:
    name: Package Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Pack tarball
        run: npm pack --dry-run 2>&1 | tail -20
      - name: Verify package contents
        run: |
          npm pack
          tar -tzf *.tgz | head -50
          # Verify critical files exist
          tar -tzf *.tgz | grep -q "dist/index.js" || exit 1
          tar -tzf *.tgz | grep -q "bin/telegram-mcp.js" || exit 1
          tar -tzf *.tgz | grep -q "server.json" || exit 1
          tar -tzf *.tgz | grep -q "dist/cli/dashboard.js" || exit 1
          tar -tzf *.tgz | grep -q "dist/cli/approvals.js" || exit 1
          tar -tzf *.tgz | grep -q "dist/access.js" || exit 1
          tar -tzf *.tgz | grep -q "dist/approvals.js" || exit 1
          tar -tzf *.tgz | grep -q "dist/workflows.js" || exit 1
          tar -tzf *.tgz | grep -q "dist/workflow-core.js" || exit 1
          tar -tzf *.tgz | grep -q "dist/mcp-extras.js" || exit 1
          tar -tzf *.tgz | grep -q "dist/audit-read.js" || exit 1
          tar -tzf *.tgz | grep -q "dist/server-registry.js" || exit 1
      - name: Verify server.json validity
        run: |
          cat server.json | jq -e '.name == "io.github.dikaglorya/telegram-mcp"' || exit 1
          cat server.json | jq -e '.version == "1.1.0"' || exit 1
          cat server.json | jq -e '.packages[0].identifier == "@dikacode/telegram-mcp"' || exit 1
          cat server.json | jq -e '.packages[0].environmentVariables[] | select(.name=="TELEGRAM_API_ID").isRequired == true' || exit 1
          cat server.json | jq -e '.packages[0].environmentVariables[] | select(.name=="TELEGRAM_API_HASH").isSecret == true' || exit 1

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:typescript"

  publish-docs:
    name: Build Docs (deploy skipped - enable Pages first)
    needs: [lint-and-typecheck, unit-tests, package-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify docs structure
        run: |
          test -f docs/_config.yml
          test -f docs/index.md
          test -f docs/tools.md
          test -d docs/_layouts
          test -d docs/assets
          echo "Docs structure OK"