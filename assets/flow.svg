<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">How telegram-mcp fits together</title>
  <desc id="flowDesc">Animated isometric diagram: an AI agent talks JSON-RPC to the local MCP server, which talks MTProto to Telegram. Packets travel along both links.</desc>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset="1" stop-color="#0a1428"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13294f"/>
      <stop offset="1" stop-color="#0a1a33"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a33"/>
      <stop offset="1" stop-color="#050c19"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="fblur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="fglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="fdrop" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1100" height="540" rx="18" fill="url(#fbg)" stroke="#16294a"/>
  <ellipse cx="550" cy="300" rx="420" ry="210" fill="#1d4ed8" opacity="0.13" filter="url(#fblur)"/>
  <g><circle cx="645.8" cy="31.0" r="1.73" fill="#cfe6ff"><animate attributeName="opacity" values="0.22;0.74;0.22" dur="7.46s" begin="1.88s" repeatCount="indefinite"/></circle>
    <circle cx="572.1" cy="101.0" r="0.72" fill="#cfe6ff"><animate attributeName="opacity" values="0.27;0.87;0.27" dur="3.57s" begin="1.51s" repeatCount="indefinite"/></circle>
    <circle cx="537.5" cy="45.4" r="0.9" fill="#cfe6ff"><animate attributeName="opacity" values="0.09;0.64;0.09" dur="4.27s" begin="3.99s" repeatCount="indefinite"/></circle>
    <circle cx="401.3" cy="189.4" r="0.95" fill="#cfe6ff"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="5.1s" begin="0.59s" repeatCount="indefinite"/></circle>
    <circle cx="106.7" cy="151.2" r="0.64" fill="#cfe6ff"><animate attributeName="opacity" values="0.28;0.99;0.28" dur="2.88s" begin="2.25s" repeatCount="indefinite"/></circle>
    <circle cx="509.9" cy="228.5" r="1.53" fill="#cfe6ff"><animate attributeName="opacity" values="0.17;0.64;0.17" dur="6.98s" begin="6.91s" repeatCount="indefinite"/></circle>
    <circle cx="1009.3" cy="142.6" r="0.64" fill="#cfe6ff"><animate attributeName="opacity" values="0.27;0.73;0.27" dur="6.37s" begin="5.7s" repeatCount="indefinite"/></circle>
    <circle cx="363.5" cy="70.1" r="1.42" fill="#cfe6ff"><animate attributeName="opacity" values="0.29;0.96;0.29" dur="6.89s" begin="3.11s" repeatCount="indefinite"/></circle>
    <circle cx="530.7" cy="118.9" r="1.47" fill="#cfe6ff"><animate attributeName="opacity" values="0.14;0.79;0.14" dur="5.49s" begin="1.44s" repeatCount="indefinite"/></circle>
    <circle cx="362.9" cy="143.0" r="1.63" fill="#cfe6ff"><animate attributeName="opacity" values="0.18;0.74;0.18" dur="5.95s" begin="5.06s" repeatCount="indefinite"/></circle>
    <circle cx="97.7" cy="40.9" r="1.77" fill="#cfe6ff"><animate attributeName="opacity" values="0.12;0.63;0.12" dur="4.92s" begin="6.16s" repeatCount="indefinite"/></circle>
    <circle cx="134.8" cy="240.2" r="1.17" fill="#cfe6ff"><animate attributeName="opacity" values="0.19;0.94;0.19" dur="4.72s" begin="4.32s" repeatCount="indefinite"/></circle>
    <circle cx="160.7" cy="249.6" r="1.06" fill="#cfe6ff"><animate attributeName="opacity" values="0.17;0.87;0.17" dur="5.29s" begin="2.63s" repeatCount="indefinite"/></circle>
    <circle cx="188.4" cy="235.7" r="1.6" fill="#cfe6ff"><animate attributeName="opacity" values="0.3;0.72;0.3" dur="6.23s" begin="5.43s" repeatCount="indefinite"/></circle>
    <circle cx="682.0" cy="148.3" r="0.64" fill="#cfe6ff"><animate attributeName="opacity" values="0.24;0.61;0.24" dur="5.45s" begin="4.42s" repeatCount="indefinite"/></circle>
    <circle cx="270.7" cy="276.4" r="1.55" fill="#cfe6ff"><animate attributeName="opacity" values="0.16;0.67;0.16" dur="5.55s" begin="1.49s" repeatCount="indefinite"/></circle>
    <circle cx="648.2" cy="127.0" r="1.78" fill="#cfe6ff"><animate attributeName="opacity" values="0.09;0.59;0.09" dur="3.18s" begin="5.61s" repeatCount="indefinite"/></circle>
    <circle cx="495.3" cy="284.3" r="0.92" fill="#cfe6ff"><animate attributeName="opacity" values="0.24;0.88;0.24" dur="7.32s" begin="4.73s" repeatCount="indefinite"/></circle>
    <circle cx="556.6" cy="262.8" r="1.74" fill="#cfe6ff"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="5.3s" begin="5.12s" repeatCount="indefinite"/></circle>
    <circle cx="898.3" cy="85.5" r="1.29" fill="#cfe6ff"><animate attributeName="opacity" values="0.11;0.59;0.11" dur="6.78s" begin="1.23s" repeatCount="indefinite"/></circle>
    <circle cx="1018.2" cy="225.9" r="1.4" fill="#cfe6ff"><animate attributeName="opacity" values="0.09;0.85;0.09" dur="4.74s" begin="5.84s" repeatCount="indefinite"/></circle>
    <circle cx="910.6" cy="246.7" r="1.35" fill="#cfe6ff"><animate attributeName="opacity" values="0.23;0.61;0.23" dur="7.23s" begin="3.99s" repeatCount="indefinite"/></circle>
    <circle cx="783.4" cy="139.3" r="0.69" fill="#cfe6ff"><animate attributeName="opacity" values="0.11;0.67;0.11" dur="4.06s" begin="2.82s" repeatCount="indefinite"/></circle>
    <circle cx="242.4" cy="39.0" r="1.6" fill="#cfe6ff"><animate attributeName="opacity" values="0.26;0.67;0.26" dur="3.69s" begin="1.82s" repeatCount="indefinite"/></circle>
    <circle cx="146.1" cy="251.1" r="0.61" fill="#cfe6ff"><animate attributeName="opacity" values="0.09;0.65;0.09" dur="5.86s" begin="1.45s" repeatCount="indefinite"/></circle>
    <circle cx="177.3" cy="237.1" r="1.19" fill="#cfe6ff"><animate attributeName="opacity" values="0.2;0.56;0.2" dur="5.93s" begin="0.27s" repeatCount="indefinite"/></circle>
    <circle cx="786.4" cy="277.5" r="1.35" fill="#cfe6ff"><animate attributeName="opacity" values="0.24;0.71;0.24" dur="6.93s" begin="4.24s" repeatCount="indefinite"/></circle>
    <circle cx="355.0" cy="271.9" r="1.46" fill="#cfe6ff"><animate attributeName="opacity" values="0.22;0.8;0.22" dur="6.73s" begin="2.24s" repeatCount="indefinite"/></circle>
    <circle cx="657.0" cy="188.8" r="1.71" fill="#cfe6ff"><animate attributeName="opacity" values="0.13;0.74;0.13" dur="5.93s" begin="1.31s" repeatCount="indefinite"/></circle>
    <circle cx="1045.1" cy="67.9" r="1.71" fill="#cfe6ff"><animate attributeName="opacity" values="0.15;0.88;0.15" dur="6.08s" begin="0.18s" repeatCount="indefinite"/></circle></g>

  <!-- connection wires -->
  <g fill="none" stroke-linecap="round">
    <path id="wireA" d="M 305 344 C 360 306 410 384 466 344" stroke="#1e3a5f" stroke-width="2"/>
    <path d="M 305 344 C 360 306 410 384 466 344" stroke="url(#wire)" stroke-width="2.4" stroke-dasharray="7 11" opacity="0.85">
      <animate attributeName="stroke-dashoffset" values="0;-72" dur="3s" repeatCount="indefinite"/>
    </path>
    <path id="wireB" d="M 634 344 C 690 306 740 384 796 344" stroke="#1e3a5f" stroke-width="2"/>
    <path d="M 634 344 C 690 306 740 384 796 344" stroke="url(#wire)" stroke-width="2.4" stroke-dasharray="7 11" opacity="0.85">
      <animate attributeName="stroke-dashoffset" values="0;-72" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="386" y="300" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7f9bc4">JSON-RPC · stdio</text>
  <text x="716" y="300" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7f9bc4">MTProto · encrypted</text>

  <!-- packets -->
  <g fill="#7dd3fc">
    <circle r="4"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath xlink:href="#wireA"/></animateMotion><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite"><mpath xlink:href="#wireA"/></animateMotion><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#c4b5fd"><animateMotion dur="3.1s" begin="0.6s" repeatCount="indefinite"><mpath xlink:href="#wireB"/></animateMotion><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#c4b5fd"><animateMotion dur="3.1s" begin="2.1s" repeatCount="indefinite"><mpath xlink:href="#wireB"/></animateMotion><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- platform A: agent -->
  <g filter="url(#fdrop)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="7s" repeatCount="indefinite"/>
      <polygon points="200,330 310,385 200,440 90,385" fill="url(#plate)" stroke="#1e40af" stroke-opacity="0.6"/>
      <polygon points="90,385 200,440 200,456 90,401" fill="url(#edge)"/>
      <polygon points="310,385 200,440 200,456 310,401" fill="url(#edge)"/>
      <g transform="translate(200,357)">
        <rect x="-44" y="-26" width="88" height="52" rx="8" fill="#071226" stroke="#2563eb" stroke-opacity="0.8"/>
        <rect x="-44" y="-26" width="88" height="13" rx="8" fill="#0d1f3d"/>
        <circle cx="-35" cy="-19.5" r="2" fill="#f87171"/><circle cx="-27" cy="-19.5" r="2" fill="#fbbf24"/><circle cx="-19" cy="-19.5" r="2" fill="#34d399"/>
        <text x="-32" y="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#7dd3fc">&gt;_</text>
        <rect x="-12" y="1" width="30" height="3" rx="1.5" fill="#38bdf8" opacity="0.5">
          <animate attributeName="opacity" values="0.15;0.7;0.15" dur="1.6s" repeatCount="indefinite"/>
        </rect>
      </g>
      <text x="200" y="486" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#dbeafe">AGENT</text>
    </g>
  </g>

  <!-- platform B: MCP core -->
  <g filter="url(#fdrop)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -11;0 0" dur="5.5s" repeatCount="indefinite"/>
      <polygon points="550,330 660,385 550,440 440,385" fill="url(#plate)" stroke="#7c3aed" stroke-opacity="0.7"/>
      <polygon points="440,385 550,440 550,456 440,401" fill="url(#edge)"/>
      <polygon points="660,385 550,440 550,456 660,401" fill="url(#edge)"/>
      <g transform="translate(550,372)">
        <circle r="30" fill="#1d4ed8" opacity="0.25" filter="url(#fglow)"/>
        <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="none" stroke="url(#core)" stroke-width="2.5">
          <animateTransform attributeName="transform" type="rotate" values="0;360" dur="9s" repeatCount="indefinite"/>
        </polygon>
        <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#0ea5e9" opacity="0.25">
          <animate attributeName="opacity" values="0.15;0.45;0.15" dur="2.8s" repeatCount="indefinite"/>
        </polygon>
        <text x="0" y="5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#dbeafe">MCP</text>
      </g>
      <text x="550" y="486" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#dbeafe">MCP SERVER</text>
      <text x="550" y="506" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7f9bc4">69 tools · local process</text>
    </g>
  </g>

  <!-- platform C: telegram -->
  <g filter="url(#fdrop)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="6.2s" repeatCount="indefinite"/>
      <polygon points="900,330 1010,385 900,440 790,385" fill="url(#plate)" stroke="#0e7490" stroke-opacity="0.7"/>
      <polygon points="790,385 900,440 900,456 790,401" fill="url(#edge)"/>
      <polygon points="1010,385 900,440 900,456 1010,401" fill="url(#edge)"/>
      <g transform="translate(900,368)">
        <circle r="34" fill="#0ea5e9" opacity="0.22" filter="url(#fglow)"/>
        <path d="M-26 -8 L28 -24 L8 2 L6 22 L-2 8 Z" fill="#7dd3fc">
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" repeatCount="indefinite"/>
        </path>
        <path d="M28 -24 L-2 8 L6 22 L8 2 Z" fill="#38bdf8"/>
      </g>
      <text x="900" y="486" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#dbeafe">TELEGRAM</text>
      <text x="900" y="506" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7f9bc4">your account · your session</text>
    </g>
  </g>
</svg>
